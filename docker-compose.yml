services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rdh}
    volumes:
      - rdh_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdh -d rdh"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-rdh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rdh}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-0}
      SERVE_SPA: "1"
      SPA_ROOT: /app/dist
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      - ./dist:/app/dist:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rdh_pgdata:
